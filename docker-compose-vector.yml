services:
  postgres-vector:
    image: pgvector/pgvector:pg17
    container_name: enterprise-ai-pgvector
    restart: unless-stopped

    environment:
      POSTGRES_DB: enterprise_ai_vector
      POSTGRES_USER: vector_app
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - enterprise-ai-pgvector-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector_app -d enterprise_ai_vector"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  enterprise-ai-pgvector-data: