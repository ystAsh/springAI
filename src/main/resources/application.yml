spring:
  application:
    name: springAI

  # ===============================
  # MSSQL Primary Database
  # ===============================
  datasource:
    url: ${MSSQL_URL:jdbc:sqlserver://localhost:1433;databaseName=enterprise_ai;encrypt=true;trustServerCertificate=true}
    username: ${MSSQL_USERNAME:enterprise_ai_app}
    password: ${MSSQL_PASSWORD}

  # ===============================
  # JPA
  # ===============================
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ===============================
  # Flyway
  # ===============================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1
    baseline-description: Initial existing MSSQL schema

  # ===============================
  # Spring AI
  # ===============================
  ai:
    model:
      chat: google-genai
      embedding:
        text: google-genai

    google:
      genai:
        api-key: ${GEMINI_API_KEY}

        chat:
          model: gemini-2.5-flash
          temperature: 0.3
          max-output-tokens: 1000

        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 768

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  upload:
    vector-document-directory: ${VECTOR_DOCUMENT_DIRECTORY:./uploads/vector-documents}