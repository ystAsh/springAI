spring:
  application:
    name: springAI

  # ===============================
  # MSSQL Primary Database
  # ===============================
  datasource:
    url: ${MSSQL_URL:jdbc:sqlserver://localhost:1433;databaseName=enterprise_ai;encrypt=true;trustServerCertificate=true}
    username: ${MSSQL_USERNAME:enterprise_ai_app}
    password: ${MSSQL_PASSWORD}

  # ===============================
  # JPA
  # ===============================
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ===============================
  # Flyway
  # ===============================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1
    baseline-description: Initial existing MSSQL schema

  # ===============================
  # Spring AI
  # ===============================
  ai:
    model:
      chat: google-genai
      embedding:
        text: google-genai

    google:
      genai:
        api-key: ${GEMINI_API_KEY}

        chat:
          model: gemini-2.5-flash
          temperature: 0.3
          max-output-tokens: 1000

        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 768

  # ===============================
  # Multipart Upload
  # ===============================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ===============================
# Application Custom Settings
# ===============================
app:
  # PostgreSQL Vector Database
  datasource:
    vector:
      url: ${VECTOR_DB_URL:jdbc:postgresql://localhost:5433/enterprise_ai_vector}
      username: ${VECTOR_DB_USERNAME:vector_app}
      password: ${VECTOR_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

  # Document Upload
  upload:
    vector-document-directory: ${VECTOR_DOCUMENT_DIRECTORY:./uploads/vector-documents}
    max-file-size-bytes: 10485760

  # Document RAG
  rag:
    document:
      similarity-threshold: 0.65